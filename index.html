<html lang="en">
<head>

<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;justify-content:center;padding:28px 16px 60px}
.wrap{width:100%;max-width:700px}
h1{font-family:var(--mono);font-size:20px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 22px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
.subj{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:16px 18px;margin-bottom:12px;cursor:pointer;color:var(--text);font-family:var(--sans)}
.subj:hover{border-color:var(--c)}
.subj b{font-family:var(--mono);font-size:16px;display:block;margin-bottom:4px}
.subj span{color:var(--muted);font-size:13.5px}
button.p,button.g{font-family:var(--mono);font-size:14px;font-weight:700;padding:12px 20px;border-radius:8px;cursor:pointer;border:1px solid var(--acc)}
button.p{background:var(--acc);color:#fff}
button.g{background:transparent;color:var(--text);border-color:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:10px}
.bar{height:5px;background:var(--raised);border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.qt{font-size:17px;line-height:1.5;margin:0 0 18px}
.opt{display:flex;gap:12px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:10px;cursor:pointer;font-size:14.5px;line-height:1.45}
.opt:hover:not(.lk){border-color:var(--acc)}
.opt b{font-family:var(--mono);color:var(--muted)}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.no{background:var(--no);border-color:var(--nob)}
.opt.lk{cursor:default}
.fb{font-family:var(--mono);font-size:13px;min-height:20px;margin:6px 0 16px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px}
.big{font-family:var(--mono);font-size:52px;font-weight:800;color:var(--acc);text-align:center;margin:4px 0}
.cen{text-align:center;color:var(--muted);font-family:var(--mono);font-size:13.5px;margin-bottom:18px}
.miss{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px 16px;max-height:300px;overflow-y:auto;margin-bottom:20px;text-align:left}
.miss div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.miss div:last-child{border:0}
.miss em{color:var(--okb);font-style:normal;font-family:var(--mono)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<div id="menu">
<h1>Final Exam Reviewer</h1>
<p class="sub">Pick a subject. Questions and answer choices are reshuffled every attempt, and your score appears when you finish.</p>
<div class="card" id="list"></div>
</div>

<div id="quiz" class="card hide">
<div class="row"><span id="ct"></span><span id="sc"></span></div>
<div class="bar"><i id="pg"></i></div>
<p class="qt" id="qt"></p>
<div id="ops"></div>
<div class="fb" id="fb"></div>
<div class="nav"><button class="g" onclick="toMenu()">Menu</button><button class="p" id="nx" onclick="next()" disabled>Next</button></div>
</div>

<div id="res" class="card hide">
<div class="cen" id="rn"></div>
<div class="big" id="pc"></div>
<div class="cen" id="rs"></div>
<div id="ms"></div>
<div class="nav"><button class="g" onclick="toMenu()">Choose subject</button><button class="p" onclick="start(cur)">Retry quiz</button></div>
</div>
</div>

let cur,qs,i,score,missed,answered;
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const show=id=>["menu","quiz","res"].forEach(x=>$(x).classList.toggle("hide",x!==id));

$("list").innerHTML=Object.entries(SUBJECTS).map(([k,s])=>`<button class="subj" style="--c:${s.color}" onclick="start('${k}')"><b>${s.name}</b><span>${s.q.length} questions · shuffled each attempt</span></button>`).join("");

function start(k){
  cur=k;const s=SUBJECTS[k];
  document.documentElement.style.setProperty("--acc",s.color);
  qs=shuf(s.q);i=0;score=0;missed=[];
  show("quiz");render();
}
function render(){
  answered=false;const q=qs[i];
  $("ct").textContent=`${SUBJECTS[cur].name.split(" –")[0]} · Question ${i+1} / ${qs.length}`;
  $("sc").textContent=`Score: ${score}`;
  $("pg").style.width=(i/qs.length*100)+"%";
  $("qt").textContent=q[0];$("fb").textContent="";$("fb").style.color="";
  $("nx").disabled=true;$("nx").textContent=i===qs.length-1?"See results":"Next";
  $("ops").innerHTML="";
  shuf(q.slice(1)).forEach((t,n)=>{
    const d=document.createElement("div");d.className="opt";d.dataset.ok=t===q[1]?"1":"";
    d.innerHTML=`<b>${"ABCD"[n]}</b><span></span>`;d.lastChild.textContent=t;
    d.onclick=()=>pick(d,q);$("ops").appendChild(d);
  });
}
function pick(d,q){
  if(answered)return;answered=true;
  const good=!!d.dataset.ok;
  document.querySelectorAll(".opt").forEach(o=>{o.classList.add("lk");if(o.dataset.ok)o.classList.add("ok")});
  if(good){score++;$("fb").textContent="Correct.";$("fb").style.color="var(--okb)"}
  else{d.classList.add("no");missed.push(q);$("fb").textContent="Incorrect — the correct answer is highlighted.";$("fb").style.color="var(--nob)"}
  $("sc").textContent=`Score: ${score}`;$("nx").disabled=false;
}
function next(){if(!answered)return;i++;i>=qs.length?finish():render()}
function finish(){
  show("res");
  $("rn").textContent=SUBJECTS[cur].name;
  $("pc").textContent=Math.round(score/qs.length*100)+"%";
  $("rs").textContent=`${score} / ${qs.length} correct`;
  $("ms").innerHTML="";
  if(missed.length){
    const m=document.createElement("div");m.className="miss";
    missed.forEach(q=>{const r=document.createElement("div");r.textContent=q[0]+" ";const e=document.createElement("em");e.textContent="→ "+q[1];r.appendChild(e);m.appendChild(r)});
    $("ms").appendChild(m);
  }else{$("ms").innerHTML='<div class="cen">Perfect run — no misses.</div>'}
}
function toMenu(){document.documentElement.style.removeProperty("--acc");show("menu")}
</script>
