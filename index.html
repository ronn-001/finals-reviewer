<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Reviewer</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6a7183;--ac:#3b5bdb;--bd:#dde1ec;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c202c;--tx:#eceef5;--mu:#9aa1b5;--ac:#7b93ff;--bd:#2e3446;--ok:#69db7c;--okb:#173222;--no:#ff8787;--nob:#3a1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c202c;--tx:#eceef5;--mu:#9aa1b5;--ac:#7b93ff;--bd:#2e3446;--ok:#69db7c;--okb:#173222;--no:#ff8787;--nob:#3a1d1d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:1.6rem;margin:8px 0 4px}p.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.subj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.subj:hover{border-color:var(--ac)}.subj b{display:block;font-size:1.1rem}.subj span{color:var(--mu);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--ac)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:.9rem}.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-weight:700;color:var(--ac)}
.q{font-size:1.15rem;font-weight:600;margin:0 0 16px;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;overflow-wrap:anywhere}
.opt:hover{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:var(--okb);color:var(--ok);font-weight:600}.opt.no{border-color:var(--no);background:var(--nob);color:var(--no);font-weight:600}.opt:disabled{cursor:default}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.alt{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.score{text-align:center}.score .n{font-size:3rem;font-weight:800;color:var(--ac)}
.rv{border-left:4px solid var(--no);background:var(--nob);padding:10px 12px;border-radius:8px;margin-bottom:10px;overflow-wrap:anywhere;font-size:.95rem}
.rv .g{color:var(--ok);font-weight:600}
</style></head>
<body><main id="app"></main>
<script>
// [question, correct answer, wrong1, wrong2, wrong3]
const DATA={
ITE:{name:"ITE101 – Core Web Technologies",desc:"HTML, CSS, JavaScript & APIs",q:[
["Which technology provides the structure and skeleton of a webpage?","HTML","CSS","JavaScript","APIs"],
["Who invented and introduced HTML?","Tim Berners-Lee","Brendan Eich","Bill Gates","Linus Torvalds"],
["In what year was HTML officially released?","1991","1985","1995","2000"],
["What is the root element of an HTML document?","<html>","<head>","<body>","<root>"],
["Which declaration tells the browser the document uses HTML5?","<!DOCTYPE html>","<html5>","<!HTML5>","<doctype version=5>"],
["What is the primary tool for styling and designing webpages?","CSS","HTML","JavaScript","APIs"],
["Which technology adds behavior, interactivity and dynamic features?","JavaScript","HTML","CSS","Hypertext"],
["What is the common file extension of JavaScript files?",".js",".java",".script",".jv"],
["What do APIs do?","Connect and allow communication between software systems","Style webpage layouts","Define a page’s structure","Store images on a page"],
["What is rendering?","Converting webpage code into a visible webpage","Writing code in an editor","Saving a file as .html","Encrypting a webpage"],
["Hypertext refers to…","Hyperlinks connecting webpages","Text that is very large","Text written in CSS","Hidden text in a page"],
["What is an HTML tag?","A command enclosed in angle brackets","A command in curly braces","A command in parentheses","A command in square brackets"],
["Which is the correct syntax for an HTML comment?","<\!-- This is a comment -->","// This is a comment","/* This is a comment */","# This is a comment"],
["HTML files are saved with which extension?",".html",".xml",".css",".htl"],
["Which is a complete HTML element?","<p>This is a paragraph.</p>","<p>","</p>","This is a paragraph."],
["In <a href=\"https://www.google.com\">, what is href?","An attribute","A tag","A void element","A comment"],
["Which is a void element (needs no closing tag)?","<img>","<p>","<div>","<h1>"],
["Which heading level is the smallest?","<h6>","<h1>","<h3>","<head>"],
["What does the <pre> tag do?","Preserves spaces and line breaks as written","Highlights text","Adds a table caption","Creates a heading"],
["Which tag is used to highlight text?","<mark>","<pre>","<dt>","<caption>"],
["Which tags create a description list?","<dl>, <dt>, <dd>","<ul>, <li>","<ol>, <li>","<dd>, <dr>"],
["In a description list, what does <dt> represent?","Description term","Description details","Description list","Data table"],
["In <ol>, what does type=\"i\" display?","Lowercase Roman numerals","Uppercase Roman numerals","Lowercase letters","Numbers"],
["What does the start attribute of <ol> specify?","The starting number of the list","The list style","The list’s color","The number of items"],
["Which HTML entity displays the less-than symbol (<)?","&lt;","&gt;","&amp;","&quot;"],
["Which tag adds a title to a table?","<caption>","<title>","<th>","<thead>"],
["What does colspan allow?","A cell to extend horizontally across multiple columns","A cell to extend vertically across rows","A table to have borders","A table to have a caption"],
["What does rowspan allow?","A cell to extend vertically across multiple rows","A cell to extend across columns","A row to be hidden","A table to be sorted"],
["What does the placeholder attribute do?","Shows temporary guide text in an empty input","Makes an input required","Sets the input’s default value","Hides the input"],
["Which input type gives automatic email format validation?","type=\"email\"","type=\"text\"","type=\"mail\"","type=\"url\""],
["Which input type masks the characters typed?","type=\"password\"","type=\"hidden\"","type=\"secret\"","type=\"text\""],
["Which input type is designed for a single-option choice group?","type=\"radio\"","type=\"checkbox\"","type=\"range\"","type=\"submit\""],
["Which method places CSS directly inside an HTML element?","Inline CSS using the style attribute","External stylesheet","Internal <style> block","@import rule"],
["What is a CSS selector?","A pattern used to identify HTML elements to style","A tool that selects files","A JavaScript function","A type of HTML tag"],
["Which symbol represents the universal selector?","*","#",".","&"],
["An ID selector is preceded by which symbol?","# (hashtag)",". (dot)","* (asterisk)","@ (at sign)"],
["When is a class selector appropriate?","When applying the same style to multiple elements","When styling one unique element only","When styling every element on the page","When writing JavaScript"],
["What does a grouping selector allow?","The same CSS rules applied to multiple selectors","Grouping HTML files together","Nesting tables","Grouping JavaScript variables"],
["Which property changes an element’s background color?","background-color","color","bgcolor","font-color"],
["Which property specifies the typeface used for text?","font-family","font-style","font-type","text-font"],
["Which property controls the thickness or boldness of text?","font-weight","font-size","text-weight","font-style"],
["In the box model, which part is the innermost?","Content","Padding","Border","Margin"],
["In the box model, what is padding?","Space between an element’s content and its border","Space outside the border","The border’s thickness","The element’s background"],
["What does border: 2px solid black; create?","A solid black border 2 pixels thick","A dotted black border 2 pixels thick","A solid black border 2 em wide","A 2-pixel black shadow"],
["How do CSS transform functions affect layout?","They alter an element’s geometry without affecting normal document flow","They reorder the HTML source","They move other elements out of the way","They delete the element"],
["What does scale(0.8) do?","Shrinks the content size","Enlarges the content","Rotates the content","Hides the content"],
["What does CSS animation do?","Transitions elements smoothly between styles without JavaScript","Requires JavaScript to run","Only changes text color","Loads images faster"],
["Which tag embeds JavaScript into an HTML document?","<script>","<js>","<javascript>","<code>"],
["Which statement displays a pop-up message box?","alert(\"Welcome\");","console.log(\"Welcome\");","popup(\"Welcome\");","print(\"Welcome\");"],
["Which keyword declares a variable that cannot be reassigned?","const","let","var","static"]
]},
IPT:{name:"IPT101 – Integrative Programming Technologies",desc:"Java, Swing GUI & JDBC",q:[
["Which component of the Java platform executes compiled bytecode?","JVM","JDK","javac","IDE"],
["Which command compiles a Java source file?","javac","java","jar","javadoc"],
["Which statement correctly declares and initializes an integer named age?","int age = 20;","integer age = 20;","age int = 20;","int age := 20;"],
["Which Java data type stores either true or false?","boolean","bit","int","char"],
["Which statement correctly declares a constant?","final int MAX = 100;","const int MAX = 100;","static int MAX = 100;","constant MAX = 100;"],
["Which operator checks whether two values are equal?","==","=","!=","==>"],
["Which operator requires both Boolean expressions to be true?","&&","||","!","&"],
["Which structure suits selecting among multiple conditions?","if-else-if","for","while","break"],
["Which loop is commonly used when the number of repetitions is known?","for","while","do-while","if"],
["What is the purpose of break inside a switch or loop?","Exit the switch or loop","Skip to the next iteration","Restart the loop","End the program"],
["Which statement creates an integer array of 10 elements?","int[] numbers = new int[10];","int numbers = new int(10);","int[] numbers = int[10];","array numbers = new int[10];"],
["What is the first valid index of a Java array?","0","1","-1","length"],
["Given int[] scores = {75, 80, 85, 90};, which expression retrieves 85?","scores[2]","scores[3]","scores[1]","scores(2)"],
["Which property gives the number of elements in an array?","length","size","count","length()"],
["What is the primary purpose of a class in OOP?","It serves as a blueprint for objects","It stores a single variable","It runs the program automatically","It compiles source code"],
["Which statement correctly creates an object of class Student?","Student s = new Student();","Student s = Student();","new Student s();","Student s = create Student();"],
["Which OOP principle lets one class acquire properties and behaviors of another?","Inheritance","Encapsulation","Abstraction","Compilation"],
["A constructor is primarily used for…","Initializing an object when it is created","Destroying an object","Compiling a class","Printing output"],
["Which Swing component represents the main application window?","JFrame","JPanel","JLabel","JButton"],
["Which Swing component accepts a single line of text?","JTextField","JTextArea","JLabel","JTable"],
["Which layout manager divides a container into NORTH, SOUTH, EAST, WEST and CENTER?","BorderLayout","GridLayout","FlowLayout","CardLayout"],
["Which layout manager arranges components in rows and columns of equal-sized cells?","GridLayout","BorderLayout","FlowLayout","BoxLayout"],
["Which Swing component displays a clickable command button?","JButton","JLabel","JCheckBox","JTextField"],
["What is an event in a GUI program?","A user or system action that can trigger program behavior","A compiled class file","A database record","A type of layout"],
["Which listener is commonly used to handle a JButton click?","ActionListener","KeyListener","MouseMotionListener","WindowListener"],
["What is the purpose of an event listener?","To respond when a specified event occurs","To draw components","To connect to a database","To compile code"],
["When a JButton with an ActionListener is clicked, what happens?","Its associated event-handling code executes","The window closes","The program restarts","Nothing happens"],
["Which listener is designed for keyboard-related events?","KeyListener","ActionListener","MouseListener","ItemListener"],
["Which Swing component displays records in rows and columns?","JTable","JList","JTextArea","JPanel"],
["Which component is commonly used for a multi-line text area in a form?","JTextArea","JTextField","JLabel","JPasswordField"],
["Why should input be validated before database processing?","To reduce invalid data and avoid preventable errors","To make the database faster","To avoid using JDBC","To change the table structure"],
["In a CRUD-style Swing application, a JTable is commonly used for…","Displaying database records","Connecting to the database","Compiling SQL","Handling keyboard events"],
["What is the main purpose of JDBC?","To connect Java applications with databases","To design GUI layouts","To compile Java files","To handle GUI events"],
["Which JDBC interface represents an active database connection?","Connection","Statement","ResultSet","DriverManager"],
["Which class is commonly used to obtain a JDBC connection?","DriverManager","PreparedStatement","ResultSet","JFrame"],
["Which object is designed to execute parameterized SQL statements?","PreparedStatement","ResultSet","Connection","DriverManager"],
["Which method is normally used for a SELECT statement that returns rows?","executeQuery()","executeUpdate()","executeRows()","getResult()"],
["Which JDBC object contains the rows returned by a SELECT query?","ResultSet","Connection","PreparedStatement","DriverManager"],
["Which method is commonly used for INSERT, UPDATE and DELETE?","executeUpdate()","executeQuery()","executeSelect()","executeRows()"],
["Which PreparedStatement method assigns a String value to a ? parameter?","setString()","getString()","setText()","putString()"],
["Which method moves a ResultSet cursor to the next row?","next()","move()","forward()","nextRow()"],
["Why is PreparedStatement preferred for SQL with user-supplied values?","It supports parameterized SQL and helps reduce SQL injection risk","It runs without a connection","It works only with SELECT","It removes the need for validation"],
["What is the typical sequence of a database operation started from a Swing button?","Button event → JDBC method → SQL → database → result → GUI","SQL → GUI → button event → database","Database → SQL → button event → GUI","GUI → database → JDBC → button event"],
["Which set correctly represents CRUD operations?","Create, Read, Update, Delete","Connect, Run, Update, Display","Create, Retrieve, Upload, Drop","Copy, Read, Undo, Delete"],
["When SQL must accept user-entered values, it is best to…","Use PreparedStatement with ? placeholders","Concatenate the input directly into the SQL string","Skip validation","Use only executeQuery()"],
["Which SQL operation is the ‘Read’ part of CRUD?","SELECT","INSERT","UPDATE","DELETE"],
["Which operation changes an existing database record?","UPDATE","INSERT","SELECT","CREATE"],
["Which operation removes an existing database record?","DELETE","SELECT","UPDATE","INSERT"],
["Which JDBC component represents the results of a SELECT operation?","ResultSet","Connection","DriverManager","executeUpdate()"],
["An app connects successfully but shows no records. Which JDBC component should you check first when processing returned rows?","ResultSet","DriverManager","JFrame","ActionListener"]
]}};
const app=document.getElementById("app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let S;
function menu(){
  app.replaceChildren();
  app.append(el("h1",0,"Quiz Reviewer"),el("p","sub","Choose a subject to start. Each quiz has 50 items, shuffled every attempt."));
  for(const k in DATA){const b=el("button","subj");b.append(el("b",0,DATA[k].name),el("span",0,DATA[k].desc+" · "+DATA[k].q.length+" items"));b.onclick=()=>start(k);app.append(b)}
}
function start(k){
  S={k,i:0,score:0,miss:[],items:shuf(DATA[k].q).map(r=>({q:r[0],a:r[1],o:shuf(r.slice(1))}))};
  show();
}
function show(){
  const it=S.items[S.i],n=S.items.length;let pick=null;
  app.replaceChildren();
  const m=el("div","meta");const sc=el("span","pill","Score: "+S.score+" / "+n);m.append(el("span",0,DATA[S.k].name.split(" – ")[0]),el("span",0,"Question "+(S.i+1)+" of "+n),sc);
  const bar=el("div","bar");const fill=el("i");fill.style.width=(S.i/n*100)+"%";bar.append(fill);
  const card=el("div","card");card.append(el("p","q",it.q));
  const nx=el("button","btn",S.i==n-1?"Finish":"Next");nx.disabled=true;
  it.o.forEach(t=>{const b=el("button","opt",t);b.onclick=()=>{if(pick!==null)return;pick=t;if(t===it.a){S.score++;sc.textContent="Score: "+S.score+" / "+n}card.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add("ok")});if(t!==it.a)b.classList.add("no");nx.disabled=false};card.append(b)});
  nx.onclick=()=>{if(pick!==it.a)S.miss.push({q:it.q,y:pick,a:it.a});S.i++;S.i<n?show():result()};
  const row=el("div","row");const q=el("button","btn alt","Quit");q.onclick=()=>{if(confirm("Quit this quiz? Progress will be lost."))menu()};row.append(nx,q);
  app.append(m,bar,card,row);
}
function result(){
  const n=S.items.length,p=Math.round(S.score/n*100);
  app.replaceChildren();
  const c=el("div","card score");c.append(el("div","meta","Your score"),el("div","n",S.score+" / "+n),el("div",0,p+"% · "+(p>=75?"Great job!":p>=50?"Good effort, keep reviewing!":"Keep practicing, you’ll get there!")));
  const row=el("div","row");row.style.justifyContent="center";
  const r=el("button","btn","Retry");r.onclick=()=>start(S.k);
  const mn=el("button","btn alt","Choose subject");mn.onclick=menu;row.append(r,mn);c.append(row);app.append(c);
  if(S.miss.length){app.append(el("h2",0,"Review your mistakes ("+S.miss.length+")"));
    S.miss.forEach(x=>{const d=el("div","rv");d.append(el("div",0,x.q),el("div",0,"Your answer: "+x.y),el("div","g","Correct: "+x.a));app.append(d)})}
}
menu();
</script></body></html>
